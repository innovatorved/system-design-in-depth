  <script>
    const solutionCode = `class TokenBucketLimiter {
  constructor(capacity, refillRatePerSec) {
    this.capacity = capacity;
    this.refillRate = refillRatePerSec;
    this.tokens = capacity;
    this.lastRefill = Date.now();
  }

  allow(cost = 1, now = Date.now()) {
    const elapsedSec = Math.max(0, (now - this.lastRefill) / 1000);
    this.tokens = Math.min(this.capacity, this.tokens + elapsedSec * this.refillRate);
    this.lastRefill = now;
    if (this.tokens >= cost) {
      this.tokens -= cost;
      return { allowed: true, remaining: Math.floor(this.tokens) };
    }
    return { allowed: false, remaining: Math.floor(this.tokens) };
  }
}

module.exports = { TokenBucketLimiter };
`;

    const demoCode = `const { TokenBucketLimiter } = require('./limiter.js');

    const testCode = `const assert = require('node:assert/strict');
const { TokenBucketLimiter } = require('./limiter.js');

const tests = [];
const test = (name, fn) => tests.push({ name, fn });

test('allows bursts up to capacity', () => {
  const l = new TokenBucketLimiter(3, 1);
  assert.equal(l.allow(1, 0).allowed, true);
  assert.equal(l.allow(1, 0).allowed, true);
  assert.equal(l.allow(1, 0).allowed, true);
  assert.equal(l.allow(1, 0).allowed, false);
});

test('refills tokens over elapsed time', () => {
  const l = new TokenBucketLimiter(2, 1);
  l.allow(2, 0);
  assert.equal(l.allow(1, 500).allowed, false);
  assert.equal(l.allow(1, 1000).allowed, true);
});

(async () => {
  for (const t of tests) {
    await t.fn();
    console.log('PASS:', t.name);
  }
})();
`;
