    const solutionLimiter = `class TokenBucket {
  constructor(capacity, refillRatePerSec) {
    this.capacity = capacity;
    this.refillRatePerSec = refillRatePerSec;
    this.tokens = capacity;
    this.lastRefill = Date.now();
  }

  _refill(now = Date.now()) {
    const elapsedSec = Math.max(0, (now - this.lastRefill) / 1000);
    this.tokens = Math.min(this.capacity, this.tokens + elapsedSec * this.refillRatePerSec);
    this.lastRefill = now;
  }

  allowRequest(cost = 1, now = Date.now()) {
    this._refill(now);
    if (this.tokens >= cost) {
      this.tokens -= cost;
      return { allowed: true, remaining: Math.floor(this.tokens) };
    }
    const deficit = cost - this.tokens;
    return {
      allowed: false,
      remaining: 0,
      retryAfterMs: Math.ceil((deficit / this.refillRatePerSec) * 1000)
    };
  }
}

module.exports = { TokenBucket };
`;

    const starterLimiter = `class TokenBucket {
  constructor(capacity, refillRatePerSec) {
    this.capacity = capacity;
    this.refillRatePerSec = refillRatePerSec;
    this.tokens = capacity;
    this.lastRefill = Date.now();
  }

  _refill(now = Date.now()) {
    // TODO (Step 1): Replenish tokens proportional to elapsed seconds, capped at this.capacity
    const elapsedSec = Math.max(0, (now - this.lastRefill) / 1000);
    this.tokens = Math.min(this.capacity, this.tokens + elapsedSec * this.refillRatePerSec);
    this.lastRefill = now;
  }

  allowRequest(cost = 1, now = Date.now()) {
    // TODO (Step 2): Call this._refill(now), deduct cost if enough tokens exist, or return retryAfterMs
    this._refill(now);
    if (this.tokens >= cost) {
      this.tokens -= cost;
      return { allowed: true, remaining: Math.floor(this.tokens) };

    const deficit = cost - this.tokens;
    return {
      allowed: false,
      remaining: 0,
      retryAfterMs: Math.ceil((deficit / this.refillRatePerSec) * 1000)
    };
  }
}

module.exports = { TokenBucket };

    const serverCode = `const http = require('node:http');
const { TokenBucket } = require('./limiter');

const buckets = new Map();

const server = http.createServer((req, res) => {
  const url = new URL(req.url, 'http://localhost:3000');
  const clientKey = url.searchParams.get('client') || 'anonymous';

  if (!buckets.has(clientKey)) {
    buckets.set(clientKey, new TokenBucket(5, 1));
  }
  const decision = buckets.get(clientKey).allowRequest(1);

  res.writeHead(decision.allowed ? 200 : 429, {
    'Content-Type': 'application/json',
    'X-RateLimit-Remaining': String(decision.remaining)
  });
  res.end(JSON.stringify({ client: clientKey, ...decision }, null, 2));
});

server.listen(3000, () => {
  console.log('Rate Limiter HTTP Gateway listening on http://localhost:3000');
});
`;

        'test.js': `const { test } = require('node:test');\nconst assert = require('node:assert/strict');\nconst { TokenBucket } = require('./limiter');\n\ntest('allows burst up to capacity', () => {\n  const b = new TokenBucket(2, 1);\n  assert.equal(b.allowRequest(1, 0).allowed, true);\n  assert.equal(b.allowRequest(1, 0).allowed, true);\n  assert.equal(b.allowRequest(1, 0).allowed, false);\n});\n\ntest('refills tokens over elapsed time', () => {\n  const b = new TokenBucket(2, 2);\n  b.allowRequest(2, 0);\n  assert.equal(b.allowRequest(1, 500).allowed, true);\n});\n`,
