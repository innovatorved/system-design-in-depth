name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run schema, rendered HTML, and asset stamp checks
        run: |
          npm test
          npm run stamp:check

      - name: Verify static pages, sitemap, and dist build are in sync
        run: |
          npm run prerender
          git diff --exit-code index.html topic/ build/ roadmap/ challenges/ sandbox/ dashboard/ glossary/ sitemap.xml
          npm run build
