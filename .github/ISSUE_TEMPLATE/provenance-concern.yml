name: Provenance or Citation Concern
description: Report an attribution, provenance, or originality question regarding curriculum content
title: "[Provenance Concern]: "
labels: ["provenance", "editorial"]
body:
  - type: markdown
    attributes:
      value: We take intellectual property, originality, and proper citation seriously. Please detail your concern below.
  - type: input
    id: affected-asset
    attributes:
      label: Affected Topic, Diagram, or File
      placeholder: "e.g., data/content/m04-nosql-partitioning.js"
    validations:
      required: true
  - type: textarea
    id: concern-details
    attributes:
      label: Description of Concern
      description: Detail whether this concerns missing citations, overlapping taxonomy, or licensing.
    validations:
      required: true
  - type: textarea
    id: comparison-reference
    attributes:
      label: External Reference or Comparison Source
      description: Link to the external source or publication in question.
    validations:
      required: true
  - type: textarea
    id: proposed-resolution
    attributes:
      label: Suggested Remediation
      description: Proposed citation, re-structuring, or modification.
    validations:
      required: false
