name: Factual or Technical Error Report
description: Report a factual, algorithmic, or technical inaccuracy in curriculum lessons
title: "[Factual Error]: "
labels: ["triage", "content-accuracy"]
body:
  - type: markdown
    attributes:
      value: Thank you for helping keep the System Design in Depth curriculum accurate and rigorous.
  - type: input
    id: lesson-slug
    attributes:
      label: Affected Lesson or Topic Slug
      description: The URL hash or slug of the unit (e.g., `requirements-clarification`, `raft-consensus`)
      placeholder: "e.g., lsm-tree-storage-engine"
    validations:
      required: true
  - type: textarea
    id: current-statement
    attributes:
      label: Current Statement or Explanation
      description: Quote the specific sentence, equation, or diagram that contains an error.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Proposed Technical Correction
      description: Explain why the current statement is inaccurate and what the correct behavior or formulation should be.
    validations:
      required: true
  - type: textarea
    id: authoritative-sources
    attributes:
      label: Primary / Authoritative Sources
      description: Provide RFCs, research papers, official documentation, or textbooks supporting the correction.
    validations:
      required: true
