<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>System Design In Depth</title>
  <meta name="description" content="Deep system design curriculum — 18 modules, 200 units, 118 architecture diagrams, from-scratch algorithm builds, and curated video walkthroughs for senior engineers.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#111315">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/content.css">

  <!-- Theme initialization (prevent FOUC) -->
  <script>
    (() => {
      try {
        const stored = localStorage.getItem('sd-theme');
        const dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', dark ? '#111315' : '#fbfbfb');
      } catch {}
    })();
  </script>
</head>
<body>
  <!-- Skip to content -->
  <a href="#main-content" class="skip-link">Skip to content</a>

  <!-- Top Bar -->
  <header class="topbar" role="banner">
    <button class="topbar__hamburger" aria-label="Toggle sidebar" id="hamburger-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
    </button>

    <a href="#" class="topbar__brand" data-nav="home">
      <span class="topbar__brand-icon">SD</span>
      <span class="topbar__brand-text">System Design</span>
      <span class="topbar__track-badge">In Depth</span>
    </a>

    <div class="topbar__search">
      <button class="topbar__search-trigger" id="search-trigger" aria-label="Search topics">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <span>Search topics…</span>
        <span class="topbar__search-kbd">⌘K</span>
      </button>
    </div>

    <div class="topbar__actions">
      <div class="topbar__progress-pill" id="progress-pill" title="Overall progress">
        <svg class="topbar__progress-ring" viewBox="0 0 20 20">
          <circle class="track" cx="10" cy="10" r="8"/>
          <circle class="fill" cx="10" cy="10" r="8" stroke-dasharray="50.27" stroke-dashoffset="50.27" id="progress-ring-fill"/>
        </svg>
        <span id="progress-text">0%</span>
      </div>

      <button class="topbar__btn" id="theme-toggle" aria-label="Toggle theme" title="Toggle dark/light mode">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-sun"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-moon" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar" role="navigation" aria-label="Course navigation">
    <nav class="sidebar__tabs" role="tablist">
      <button class="sidebar__tab active" data-tab="curriculum" role="tab" aria-selected="true">Curriculum</button>
      <button class="sidebar__tab" data-tab="builds" role="tab" aria-selected="false">12 Builds</button>
    </nav>
    <div class="sidebar__content" id="sidebar-content"></div>
  </aside>

  <!-- Sidebar overlay (mobile) -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- Main Content -->
  <main class="main" id="main-content" role="main">
    <div class="main__content" id="reader"></div>
  </main>

  <!-- Search Modal -->
  <div class="search-modal" id="search-modal" role="dialog" aria-label="Search topics" aria-modal="true">
    <div class="search-modal__backdrop" id="search-backdrop"></div>
    <div class="search-modal__dialog">
      <div class="search-modal__input-wrap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input class="search-modal__input" id="search-input" type="text" placeholder="Search 200 topics…" autocomplete="off" spellcheck="false">
      </div>
      <div class="search-modal__results" id="search-results"></div>
      <div class="search-modal__footer">
        <span><kbd>↑</kbd><kbd>↓</kbd> Navigate</span>
        <span><kbd>↵</kbd> Open</span>
        <span><kbd>Esc</kbd> Close</span>
      </div>
    </div>
  </div>

  <!-- Diagram Lightbox Modal -->
  <div class="diagram-lightbox" id="diagram-lightbox" role="dialog" aria-label="Architecture diagram viewer" aria-modal="true">
    <div class="diagram-lightbox__backdrop" id="diagram-lightbox-backdrop"></div>
    <div class="diagram-lightbox__dialog">
      <div class="diagram-lightbox__header">
        <div class="diagram-lightbox__title">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <path d="M3 9h18M9 21V9"/>
          </svg>
          <span>Architecture Diagram</span>
        </div>
        <div class="diagram-lightbox__actions">
          <button class="diagram-lightbox__btn" id="diagram-zoom-out" title="Zoom Out" aria-label="Zoom out">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
          <button class="diagram-lightbox__btn diagram-lightbox__btn--text" id="diagram-zoom-reset" title="Reset Zoom" aria-label="Reset zoom">
            <span id="diagram-zoom-level">100%</span>
          </button>
          <button class="diagram-lightbox__btn" id="diagram-zoom-in" title="Zoom In" aria-label="Zoom in">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
          <div class="diagram-lightbox__divider"></div>
          <button class="diagram-lightbox__btn diagram-lightbox__close" id="diagram-lightbox-close" title="Close (Esc)" aria-label="Close dialog">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>
      <div class="diagram-lightbox__body" id="diagram-lightbox-body">
        <div class="diagram-lightbox__stage" id="diagram-lightbox-stage"></div>
      </div>
      <div class="diagram-lightbox__footer">
        <span>Click and drag to pan • Scroll to zoom • Press <kbd>Esc</kbd> to close</span>
      </div>
    </div>
  </div>

  <!-- Data Scripts -->
  <script src="data/curriculum.js"></script>
  <script src="data/implementations_code.js"></script>

  <!-- App Scripts -->
  <script src="js/progress.js"></script>
  <script src="js/search.js"></script>
  <script src="js/exercises.js"></script>
  <script src="js/simulators.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/app.js"></script>

  <!-- Mermaid (lazy-loaded) -->
  <script>
    // Load mermaid only when needed
    window.loadMermaid = function() {
      if (window.mermaid) return Promise.resolve();
      if (window._mermaidPromise) return window._mermaidPromise;
      window._mermaidPromise = new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
        s.onload = () => {
          mermaid.initialize({
            startOnLoad: false,
            securityLevel: 'loose',
            theme: document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'default',
            themeVariables: {
              darkMode: document.documentElement.getAttribute('data-theme') === 'dark',
              background: '#141517',
              primaryColor: '#191a1c',
              primaryTextColor: '#f2f4f7',
              primaryBorderColor: '#36373b',
              lineColor: '#747d89',
              secondaryColor: '#151617',
              tertiaryColor: '#202123',
              fontFamily: '"Inter", -apple-system, sans-serif',
              fontSize: '13px'
            }
          });
          resolve();
        };
        s.onerror = (e) => {
          window._mermaidPromise = null;
          reject(e);
        };
        document.head.appendChild(s);
      });
      return window._mermaidPromise;
    };
  </script>
</body>
</html>
